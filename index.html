<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安全管理数据工作台</title>
<meta http-equiv="refresh" content="0; url=./web/">
<style>
  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(135deg, #1f4e5f, #2d7d92);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: #fff;
  }
  .wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: 1px; }
  p { font-size: 14px; color: #b8d4de; margin: 6px 0; line-height: 1.8; }
  a {
    display: inline-block; margin-top: 22px;
    padding: 11px 26px; background: rgba(255,255,255,.16);
    color: #fff; text-decoration: none; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.25); font-size: 14px;
  }
  a:hover { background: rgba(255,255,255,.26); }
  .tip { font-size: 12.5px; color: #8fb4c1; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>安全管理数据工作台</h1>
  <p>正在进入…</p>
  <p>如果没有自动跳转，请点下面的按钮</p>
  <a href="./web/">进入工作台</a>
  <div class="tip">数据保存在你的浏览器中，不会上传到服务器</div>
</div>
<script>
  // 立即跳转
  location.replace('./web/');
</script>
</body>
</html>
